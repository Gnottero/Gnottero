<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Valerio Collura: Computer Engineering student and professional starter of side projects">
  <style>
    :root {
      --bg: #0b0f19; --panel: #111827; --stroke: #1f2937;
      --text: #f1f5f9; --muted: #94a3b8; --dim: #475569;
      --a: #7c3aed; --b: #2563eb; --c: #06b6d4; --d: #ec4899;
      --blob-o: .55;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc; --panel: #ffffff; --stroke: #e2e8f0;
        --text: #0f172a; --muted: #475569; --dim: #94a3b8;
        --blob-o: .35;
      }
    }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--stroke); stroke-width: 1; }
    .blob { opacity: var(--blob-o); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .hello { fill: var(--muted); font-size: 22px; }
    .name { fill: var(--text); font-size: 64px; font-weight: 800; letter-spacing: -2px; }
    .role { fill: var(--muted); font-size: 22px; }
    .accent { fill: url(#txt); }
    .chip rect { fill: var(--panel); stroke: var(--stroke); }
    .chip text { fill: var(--muted); font-size: 15px; }
    .term rect.win { fill: var(--panel); stroke: var(--stroke); }
    .term .p { fill: var(--c); font-size: 15px; }
    .term .t { fill: var(--text); font-size: 15px; }
    .term .o { fill: var(--muted); font-size: 15px; }
    .term .err { fill: var(--d); font-size: 15px; }
    .cursor { fill: var(--c); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; }
    .b3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    @keyframes drift3 { to { transform: translate(80px, -50px); } }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .cursor { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M40 0H0V40" fill="none"/>
    </pattern>
    <linearGradient id="gridfade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="340" fill="url(#gridfade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="bg" width="1200" height="340"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridmask)"/>
    <g filter="url(#blur)">
      <circle class="blob b1" cx="820" cy="80" r="130" fill="#7c3aed"/>
      <circle class="blob b2" cx="1080" cy="260" r="120" fill="#06b6d4"/>
      <circle class="blob b3" cx="560" cy="330" r="110" fill="#ec4899"/>
    </g>
  </g>

  <!-- Left: intro -->
  <text class="sans hello" x="64" y="104">Hey, I'm</text>
  <text class="sans name" x="60" y="172">Valerio <tspan class="accent">Collura</tspan></text>
  <text class="sans role" x="64" y="212">Computer Engineering student @ PoliTo.</text>
  <text class="sans role" x="64" y="242">Professional starter of side projects.</text>

  <g class="chip mono">
    <rect x="64" y="268" width="118" height="34" rx="17"/>
    <text x="123" y="290" text-anchor="middle">📍 Italy</text>
    <rect x="194" y="268" width="136" height="34" rx="17"/>
    <text x="262" y="290" text-anchor="middle">aka Gnottero</text>
    <rect x="342" y="268" width="118" height="34" rx="17"/>
    <text x="401" y="290" text-anchor="middle">Arch, btw</text>
  </g>

  <!-- Right: terminal -->
  <g transform="translate(800 110)"><g class="term mono">
    <rect class="win" width="340" height="140" rx="14"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5" fill="#28c840"/>
    <text x="20" y="62"><tspan class="p">~ ❯</tspan> <tspan class="t">interests --count</tspan></text>
    <text class="err" x="20" y="88">overflow: too many to list</text>
    <text x="20" y="118"><tspan class="p">~ ❯</tspan> <tspan class="t">mkdir new-idea</tspan></text>
    <rect class="cursor" x="190" y="104" width="9" height="18" rx="1"/>
  </g></g>
</svg>
