<svg xmlns="http://www.w3.org/2000/svg" width="400" height="236" viewBox="0 0 400 236" role="img" aria-label="Bless">
  <style>
    :root {
      --panel: #0f1523; --stroke: #1f2937; --text: #f1f5f9; --muted: #94a3b8;
      --chip: #1e293b;
    }
    @media (prefers-color-scheme: light) {
      :root { --panel: #ffffff; --stroke: #e2e8f0; --text: #0f172a; --muted: #475569; --chip: #f1f5f9; }
    }
    .panel { fill: var(--panel); stroke: var(--stroke); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { fill: var(--text); font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
    .desc { fill: var(--muted); font-size: 14.5px; }
    .chip rect { fill: var(--chip); }
    .chip text { fill: var(--muted); font-size: 12px; }
    .lang { fill: var(--muted); font-size: 13px; }
    .arrow { fill: var(--muted); font-size: 20px; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="398" height="234" rx="18"/></clipPath>
  </defs>
  <rect class="panel" x="1" y="1" width="398" height="234" rx="18"/>
  <g clip-path="url(#c)"><rect width="400" height="5" fill="url(#g)"/></g>
  <rect x="28" y="30" width="40" height="40" rx="12" fill="url(#g)"/>
  <text x="48" y="57" text-anchor="middle" font-size="20">🃏</text>
  <text class="sans title" x="82" y="59">Bless</text>
  <text class="sans arrow" x="368" y="58" text-anchor="end">↗</text>
  <text class="sans desc" x="28" y="104">Website for Bless, the two-player card game</text>
  <text class="sans desc" x="28" y="126">that won Best Prototype of 2024.</text>
  <text class="sans desc" x="28" y="148">One deck. Two fates.</text>
  <g class="chip mono">
    <rect x="28" y="186" width="67" height="24" rx="12"/><text x="62" y="202" text-anchor="middle">Next.js</text>
    <rect x="103.1" y="186" width="89" height="24" rx="12"/><text x="148" y="202" text-anchor="middle">TypeScript</text>
  </g>
  <circle cx="296" cy="198" r="5" fill="#3178c6"/>
  <text class="sans lang" x="372" y="203" text-anchor="end">TypeScript</text>
</svg>
